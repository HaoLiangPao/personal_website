<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NP &amp; LP Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap">
<style>
/* Layout: sticky top bar · left algorithm index · main workspace (graph + controls | step & state panels) · takeaways.
   Deliberately single dark theme, continuing the look of the March per-algorithm pages. */
:root{
  color-scheme:dark;
  --bg:#0b0d12; --surface:#12151c; --surface2:#181c25; --line:#232836; --line2:#2e3446;
  --text:#e3e7f0; --muted:#8189a0; --faint:#4a5268;
  --blue:#4f8ef7; --green:#34c98a; --red:#f05252; --amber:#f5a623; --teal:#2ec4b6; --purple:#9d7ef7;
  --ac:var(--blue);
  --f-body:'DM Sans','PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
  --f-disp:'Instrument Serif','Songti SC','Noto Serif SC',Georgia,serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--f-body);font-size:14px;line-height:1.6;font-weight:400}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,13,18,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:22px;letter-spacing:.01em}
.topbar .sub{color:var(--muted);font-size:12px}
.topbar .keys{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.lang{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:12px;font-weight:600;padding:4px 12px;border-radius:5px;border:1px solid var(--line2);color:var(--text);background:var(--surface2)}
.lang:hover{border-color:var(--muted)}
.lang:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
kbd{font-family:var(--f-mono);font-size:10px;border:1px solid var(--line2);border-radius:3px;padding:0 4px;color:var(--muted)}

.shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;
  padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
nav.index{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);align-self:start;display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:2px}
.grp-l{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:0 8px 3px}
.nb{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:5px 8px;border-radius:5px;color:var(--muted)}
.nb .ab{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--text);min-width:64px}
.nb .hn{font-size:11.5px}
.nb:hover{background:var(--surface)}
.nb:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.nb.on{background:var(--surface2)}
.nb.on .ab{color:var(--c)}

main{min-width:0;display:flex;flex-direction:column;gap:14px}
.ahead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.ahead .abbr{font-family:var(--f-mono);font-size:26px;font-weight:600;color:var(--ac)}
.ahead .nm{color:var(--muted);font-size:14px}
.rt{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;color:var(--amber);border:1px solid rgba(245,166,35,.3);background:rgba(245,166,35,.08);padding:2px 10px;border-radius:4px}
.spec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.spec>div{background:var(--surface);padding:9px 12px;min-width:0}
.spec .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
.spec .v{font-size:12.5px}
.spec code,.tk code,.desc code,.ovt code,.rule code{font-family:var(--f-mono);font-size:.92em;color:#c9d3ea}
.warn{color:var(--amber)}

.work{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.gcard .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.badge{font-family:var(--f-mono);font-size:11px;color:var(--ac);border:1px solid var(--line2);border-radius:4px;padding:1px 8px;white-space:nowrap}
svg#g{display:block;width:100%;height:auto}
.controls{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:12px;padding:5px 12px;border:1px solid var(--line2);border-radius:5px;color:var(--text)}
.btn:hover:not([disabled]){border-color:var(--muted)}
.btn:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btn[disabled]{opacity:.35;cursor:default}
.btn.play{background:var(--ac);border-color:var(--ac);color:#0b0d12;font-weight:600}
.prog{flex:1;min-width:80px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac);width:0;transition:width .25s}
.ctr{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 14px 12px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{display:inline-block;width:16px;height:3px;border-radius:2px}

.right{display:flex;flex-direction:column;gap:12px;min-width:0}
.stepbox{padding:12px 14px}
.slbl{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);letter-spacing:.08em}
.stitle{font-family:var(--f-disp);font-style:italic;font-size:20px;line-height:1.3;margin:2px 0 8px;text-wrap:balance}
.desc{white-space:pre-line;font-size:13px;color:#c7cddb}
.ins{margin-top:10px;font-size:12.5px;border-radius:6px;padding:8px 10px;border:1px solid}
.ins.info{color:var(--ac);border-color:color-mix(in srgb,var(--ac) 30%,transparent);background:color-mix(in srgb,var(--ac) 8%,transparent)}
.ins.relax{color:var(--blue);border-color:rgba(79,142,247,.3);background:rgba(79,142,247,.07)}
.ins.warn{color:#ff8a8a;border-color:rgba(240,82,82,.35);background:rgba(240,82,82,.07)}
.ins.ok{color:var(--green);border-color:rgba(52,201,138,.3);background:rgba(52,201,138,.07)}
.ins.done{color:var(--purple);border-color:rgba(157,126,247,.35);background:rgba(157,126,247,.08)}
.pnl{padding:10px 14px}
.pnl h3{margin:0 0 7px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pnl h3 small{font-weight:400;letter-spacing:0;text-transform:none;color:var(--faint);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--f-mono);font-size:11.5px;padding:2px 8px;border-radius:4px;border:1px solid var(--line2);background:var(--surface2)}
.chip.hot{border-color:var(--amber);color:var(--amber);background:rgba(245,166,35,.08)}
.chip.ok{border-color:rgba(52,201,138,.5);color:var(--green)}
.chip.bad{border-color:rgba(240,82,82,.45);color:#ff8a8a;text-decoration:line-through}
.chip.mute{color:var(--faint);border-style:dashed}
.chip.p{border-color:rgba(157,126,247,.5);color:var(--purple)}
.chip.t{border-color:rgba(46,196,182,.5);color:var(--teal)}
.chip.b{border-color:rgba(79,142,247,.5);color:#7fb0ff}
.tw{overflow-x:auto}
table.dt{border-collapse:collapse;width:100%;font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.dt th{color:var(--faint);font-weight:400;text-align:left;padding:3px 6px;border-bottom:1px solid var(--line)}
.dt td{padding:3px 6px;border-bottom:1px solid #1a1e28;white-space:nowrap}
.dt td.hi{color:var(--amber);background:rgba(245,166,35,.1)}
.dt tr.rh td{background:rgba(255,255,255,.03)}
.dt td.inf{color:var(--faint)}

.tk{padding:12px 16px}
.tk h2{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tk ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px;max-width:90ch}
.tk li::marker{color:var(--ac)}

#ov h2{font-family:var(--f-disp);font-weight:400;font-size:24px;margin:0 0 4px}
#ov p{color:var(--muted);margin:0 0 12px;font-size:13px}
.ovt{border-collapse:collapse;width:100%;font-size:12.5px;min-width:720px}
.ovt th{text-align:left;font-weight:500;color:var(--faint);font-size:11px;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line2)}
.ovt td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ovt td.m{font-family:var(--f-mono);font-size:12px}
.ovt tr.cat td{color:var(--faint);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding-top:14px;border-bottom:none}
.ovt .go{all:unset;cursor:pointer;font-family:var(--f-mono);font-weight:600}
.ovt .go:hover{text-decoration:underline}
.rule{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:16px}
.rule div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px}
.rule b{display:block;font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:3px}
#ops h2{font-family:var(--f-disp);font-weight:400;font-size:24px;margin:0 0 4px}
#ops>p{color:var(--muted);margin:0 0 12px;font-size:13px}
#ops .rule{margin:0 0 14px}
.ovt td.how{color:#c7cddb;max-width:62ch}
.ovt td.op{font-weight:500;white-space:nowrap}
#pre h2{font-family:var(--f-disp);font-weight:400;font-size:24px;margin:0 0 4px}
#pre>p{color:var(--muted);margin:0 0 12px;font-size:13px}
#pre .rule{margin-top:14px}
.ovt.pm{min-width:980px}
.ovt.pm td{vertical-align:middle}
.lv{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11.5px;line-height:1.45;border:1px solid}
.lv.any{color:var(--green);border-color:rgba(52,201,138,.35);background:rgba(52,201,138,.07)}
.lv.req{color:var(--amber);border-color:rgba(245,166,35,.4);background:rgba(245,166,35,.08)}
.lv.no{color:#ff8a8a;border-color:rgba(240,82,82,.4);background:rgba(240,82,82,.08)}
.lv.na{color:var(--faint);border-color:var(--line2);border-style:dashed}
.pkey{display:flex;flex-wrap:wrap;gap:8px 14px;margin:0 0 12px;font-size:12px;color:var(--muted);align-items:center}

svg text{font-family:var(--f-mono)}
.el{paint-order:stroke;stroke:#0b0d12;stroke-width:4px;stroke-linejoin:round}

@media (max-width:1100px){.work{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.index{position:static;flex-direction:row;overflow-x:auto;gap:10px;padding-bottom:4px}
  .grp{flex-direction:row;align-items:center;flex:none}
  .grp-l{display:none}
  .nb .hn{display:none}
  .nb .ab{min-width:0}
  .spec{grid-template-columns:minmax(0,1fr)}
  .topbar .keys{display:none}
  .lang{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="shell">
  <nav class="index" id="nav"></nav>
  <main id="main">
    <section id="algo">
      <div class="ahead"><span class="abbr" id="a-abbr"></span><span class="nm" id="a-name"></span><span class="rt" id="a-rt"></span></div>

        <div><div class="k">Input</div><div class="v" id="s-in"></div></div>

          <div class="hd"><span id="g-cap"></span><span class="badge" id="g-badge"></span></div>

<style>
.legend b.sw{width:11px;height:11px;border-radius:3px;border:1.5px solid}
.legend b.ln{width:18px;height:0;border-top:2.5px solid;border-radius:0}
.ovt td.yes{color:var(--green);font-family:var(--f-mono);font-size:11.5px}
.ovt td.nope{color:#ff8a8a;font-family:var(--f-mono);font-size:11.5px}
pre.rec{margin:0;font-family:var(--f-mono);font-size:11.5px;line-height:1.55;color:#c9d3ea;white-space:pre;overflow-x:auto}
pre.tree{margin:0;padding:12px 14px;font-family:var(--f-mono);font-size:12px;line-height:1.6;color:#c9d3ea;white-space:pre;overflow-x:auto}
h3.sub2{font-family:var(--f-disp);font-weight:400;font-size:19px;margin:22px 0 8px}
.tpl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:0 0 14px}
.tpl div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px}
.tpl b{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--amber);font-weight:600;margin-bottom:3px}

<script>
/* ============================== language ============================== */
let LANG='en';
try{ const s=localStorage.getItem('np-lang'); if(s==='en'||s==='zh') LANG=s; }catch(e){}
const tr=(zh,en)=>LANG==='en'?en:zh;
const L2=x=>Array.isArray(x)?(LANG==='en'?x[1]:x[0]):x;

/* ============================== helpers ============================== */
const clone = o => JSON.parse(JSON.stringify(o));
function rec(){ const L=[]; return { L, add(o){ L.push(clone(o)); } }; }
const tbl = (title, head, rows, hi=[], sub='', rowhi=[]) => ({k:'table', title, head, rows, hi, sub, rowhi});
const chips = (title, items, sub='') => ({k:'chips', title, items, sub});
const note = (title, text) => ({k:'note', title, text});
const code = (title, text) => ({k:'code', title, text});
const D={
  cell:(x,y,w,h,v,st,o={})=>({k:'cell',x,y,w,h,v:String(v),st,...o}),
  txt:(x,y,s,o={})=>({k:'txt',x,y,s:String(s),...o}),
  rect:(x,y,w,h,o={})=>({k:'rect',x,y,w,h,...o}),
  line:(x1,y1,x2,y2,o={})=>({k:'line',x1,y1,x2,y2,...o}),
  node:(x,y,lab,st,o={})=>({k:'node',x,y,lab,st,...o}),
  poly:(pts,o={})=>({k:'poly',pts,...o}),
};
const CS={n:['#141820','#2d3344','#c9d3ea'],dim:['#0e1117','#1c2130','#3e4559'],hot:['#3d2a00','#f5a623','#f5a623'],ok:['#0d3326','#34c98a','#34c98a'],
  b:['#0f2140','#4f8ef7','#8fb8ff'],p:['#1a1040','#9d7ef7','#bba5ff'],t:['#082828','#2ec4b6','#2ec4b6'],r:['#3a1010','#f05252','#ff8a8a'],ghost:['#0b0d12','#1f2431','#2e3446']};
const COL={amber:'#f5a623',green:'#34c98a',blue:'#4f8ef7',red:'#f05252',teal:'#2ec4b6',purple:'#9d7ef7',muted:'#8189a0',faint:'#4a5268',text:'#e3e7f0',soft:'#c7cddb',line:'#353c50',dim:'#232836'};
const ES={n:{s:'#353c50',w:1.8},dim:{s:'#232836',w:1.4},cl:{s:'#4f8ef7',w:2.4},vr:{s:'#f05252',w:2,d:'6 4'},hot:{s:'#f5a623',w:3},ok:{s:'#34c98a',w:3},p:{s:'#9d7ef7',w:2.4},t:{s:'#2ec4b6',w:2.4}};
const lit=(s,o)=>D.cell(o.x,o.y,o.w||46,o.h||30,s,o.st||'n',{fs:13});

/* table helper reused from the DP page */
function gridScene(R,C,o){
  const lw=o.lw||44, cs=o.cs||Math.min(46,Math.floor((500-lw)/C),Math.floor(262/R)), cw=o.cw||cs, W=lw+C*cw, x0=(560-W)/2+lw, y0=o.y0||74, out=[];
  if(o.cap) out.push(D.txt(280,20,o.cap,{c:'muted',fs:12}));
  o.cl.forEach(([a,b],j)=>{ const hi=o.colHi===j; out.push(D.txt(x0+j*cw+cw/2,y0-26,a,{c:hi?'amber':'faint',fs:10})); if(b) out.push(D.txt(x0+j*cw+cw/2,y0-11,b,{c:hi?'amber':'soft',fs:12,w:600})); });
  o.rl.forEach((s,i)=>out.push(D.txt(x0-8,y0+i*cs+cs/2+1,s,{c:o.rowHiSet&&o.rowHiSet.includes(i)?'amber':'soft',fs:11.5,a:'end'})));
  for(let i=0;i<R;i++) for(let j=0;j<C;j++){ const s=o.st(i,j); if(s==='none') continue;
    out.push(D.cell(x0+j*cw+1.5,y0+i*cs+1.5,cw-3,cs-3,o.val(i,j),s,{fs:o.fs||(cs<30?11:12.5)})); }
  if(o.sep!=null) out.push(D.line(x0+o.sep*cw,y0-30,x0+o.sep*cw,y0+R*cs,{s:'faint',w:1,d:'3 3'}));
  if(o.foot) out.push(D.txt(280,Math.min(368,y0+R*cs+22),o.foot,{c:'amber',fs:12.5}));
  return out;
}

/* ============================== SAT → 3SAT ============================== */
function simSAT3(){
  const Rc=rec(), X=['x1','x2','x3','x4','x5'];
  const big=(st)=>X.map((s,k)=>lit(s,{x:72+k*52,y:66,st:st?st[k]:'n'}));
  const C3=[['x1','x2','y1'],['¬y1','x3','y2'],['¬y2','x4','x5']];
  const tri=(upto,stFn)=>{ const o=[]; for(let c=0;c<upto;c++){ const x0=40+c*172; o.push(D.rect(x0-6,176,162,44,{s:'line',sw:1.2}));
      C3[c].forEach((s,k)=>o.push(lit(s,{x:x0+k*50,y:183,st:stFn?stFn(c,k,s):(s.includes('y')?'p':'n')})));
      o.push(D.txt(x0+75,236,`c${c+1}′`,{c:'faint',fs:11})); } return o; };

  const head=[D.txt(20,82,'c =',{c:'faint',a:'start',fs:12})];

    ins:tr('方向：SAT（已知 NP-C）→ 3SAT（新问题）。known → new，反过来自动 −16。','Direction: SAT (known NP-C) → 3SAT (the new problem). Known → new; the reverse is an automatic −16.'),it:'warn',S:[...head,...big(),...short('n')],P:PN()});
  Rc.add({t:tr('k ≤ 3 的子句原样保留','Clauses with k ≤ 3 stay unchanged'),d:tr('(¬x1 ∨ x3) 只有 2 个 literal，直接放进 3SAT 的输入。','(¬x1 ∨ x3) has 2 literals; copy it into the 3SAT input.'),
    ins:tr('input transformation 要交代每一个输入，包括原样传过去的。','The input transformation must account for every input, including the ones passed through unchanged.'),it:'info',S:[...head,...big(),...short('ok')],P:PN()});
  [1,2,3].forEach(u=>Rc.add({t:tr(`拆分：第 ${u} 个新子句`,`Split: new clause ${u}`),d:u===1?tr('新建 k−3 = 2 个变量 y1, y2。\n第一个子句拿前两个 literal 加 y1：(x1 ∨ x2 ∨ y1)。','Create k−3 = 2 new variables y1, y2.\nThe first clause takes the first two literals plus y1: (x1 ∨ x2 ∨ y1).'):
      u===2?tr('中间子句：(¬y1 ∨ x3 ∨ y2)。¬y1 把它和上一个子句串起来。','Middle clause: (¬y1 ∨ x3 ∨ y2). ¬y1 chains it to the previous clause.'):tr('最后一个拿最后两个 literal：(¬y2 ∨ x4 ∨ x5)。共 k−2 = 3 个子句，每个恰好 3 个 literal。','The last clause takes the last two literals: (¬y2 ∨ x4 ∨ x5). k−2 = 3 clauses, each with exactly 3 literals.'),
    ins:u===3?tr('runtime：m 个子句，每个最多 n 个 literal → O(nm)。新变量最多 m(n−3) 个。','Runtime: m clauses of at most n literals each → O(nm). At most m(n−3) new variables.'):'',it:u===3?'info':'hide',S:[...head,...big(),...short('ok'),...tri(u)],P:PN()}));
  const A1={x1:0,x2:0,x3:0,x4:1,x5:0,y1:1,y2:1};
  const val=s=>{ const neg=s.startsWith('¬'), v=A1[neg?s.slice(1):s]; return neg?1-v:v; };
  Rc.add({t:tr('⇒ SAT 有解 ⇒ 3SAT 有解','⇒ SAT satisfiable ⇒ 3SAT satisfiable'),d:tr('取一个满足 c 的赋值：只有 x4 = T。\n第一个为真的 literal 是 a_i = x4（i = 4）。\n令 y1..y_{i−2} = T，其余 y = F → y1 = y2 = T。\n三个新子句都被满足。','Take an assignment satisfying c: only x4 = T.\nThe first true literal is a_i = x4 (i = 4).\nSet y1..y_{i−2} = T and the rest F → y1 = y2 = T.\nAll three new clauses are satisfied.'),
    ins:tr('这是 A ⇒ B 方向：由 A 的解构造 B 的解。y 的取值要显式给出来。','This is A ⇒ B: build a solution of B from a solution of A. Give the y values explicitly.'),it:'ok',
    S:[...head,...big(X.map(s=>A1[s]?'ok':'r')),...short('ok'),...tri(3,(c,k,s)=>val(s)?'ok':'r')],P:PN(Object.keys(A1).map(k=>[k,A1[k]?'T':'F']))});

    ins:tr('这是 B ⇒ A。和上一步合起来是合法的 IFF 组合。只写一个方向 + 它的逆否 = 只证了一半。','This is B ⇒ A. Together with the previous step it is a valid IFF pair. One direction plus its own contrapositive proves only half.'),it:'warn',
    S:[...head,...big(X.map(()=> 'r')),...short('n'),...tri(3,(c,k,s)=>c===2?'r':(v0(s)?'ok':'r'))],P:PN(Object.keys(A0).map(k=>[k,A0[k]?'T':'F']))});
  Rc.add({t:tr('Output transformation + NO','Output transformation + NO'),d:tr('3SAT 返回赋值 → 去掉所有 y，剩下 x 的赋值返回给 SAT。\n3SAT 返回 NO → SAT 返回 NO。\n去掉最多 m(n−3) 个新变量：O(nm)。','3SAT returns an assignment → drop every y and return the x values to SAT.\n3SAT returns NO → SAT returns NO.\nDropping at most m(n−3) new variables: O(nm).'),
    ins:tr('NP 部分：给定赋值，每个子句最多 3 个 literal，O(1) 检查，共 m 个 → O(m)（官方 3SAT.pdf）。','NP part: given an assignment, each clause has at most 3 literals, so O(1) per clause and O(m) total (official 3SAT.pdf).'),it:'done',
    S:[...head,...big(),...short('ok'),...tri(3,(c,k,s)=>s.includes('y')?'dim':'n')],P:[tbl('Runtime',[tr('部分','part'),'Big-O'],[['3SAT ∈ NP','O(m)'],['Input transform','O(nm)'],['Output transform','O(nm)'],['Overall','O(nm)']])]});
  return Rc.L;
}

/* ============================== 3SAT → IS ============================== */
function simIS(){
  const Rc=rec();
  const V={a:[90,270,'x1',1],b:[150,150,'x2',1],c:[210,270,'¬x3',1],d:[310,80,'¬x1',2],e:[320,320,'x2',2],f:[470,140,'¬x2',3],g:[470,260,'x3',3]};
  const CE=[['a','b'],['b','c'],['a','c'],['d','e'],['f','g']], VE=[['a','d'],['b','f'],['e','f'],['c','g']];
  const sc=(o)=>{ const out=[];
    if(o.ve) VE.forEach(([u,v])=>out.push(D.line(V[u][0],V[u][1],V[v][0],V[v][1],{...ES[o.veSt||'vr']})));
    CE.forEach(([u,v],i)=>{ const c=V[u][3]; if(c<=o.cl) out.push(D.line(V[u][0],V[u][1],V[v][0],V[v][1],{...ES[o.ceSt||'cl']})); });
    Object.entries(V).forEach(([k,[x,y,l,c]])=>{ if(c<=o.cl) out.push(D.node(x,y,l,o.ns?o.ns(k):'n')); });
    if(o.cl>=1) out.push(D.txt(150,330,'c1',{c:'faint',fs:11})); if(o.cl>=2) out.push(D.txt(352,200,'c2',{c:'faint',fs:11})); if(o.cl>=3) out.push(D.txt(510,200,'c3',{c:'faint',fs:11}));
    out.push(D.txt(280,22,'f = (x1 ∨ x2 ∨ ¬x3) ∧ (¬x1 ∨ x2) ∧ (¬x2 ∨ x3)',{c:'text',fs:12.5,w:600}));
    if(o.foot) out.push(D.txt(280,368,o.foot,{c:'amber',fs:12.5}));
    return out; };
  const PN=(x=[])=>[chips(tr('参数','Parameters'),[{x:'n = 3 vars'},{x:'m = 3 clauses'},{x:'|V| ≤ 3m',c:'b'},{x:'g = m = 3',c:'hot'}]),...x];
  Rc.add({t:tr('输入：3SAT 公式','Input: a 3SAT formula'),d:tr('3 个变量、3 个子句。子句可以只有 1 或 2 个 literal（"at most 3"）。','3 variables, 3 clauses. A clause may have only 1 or 2 literals ("at most 3").'),
    ins:tr('来源选同领域：IS 是图问题，但 3SAT → IS 是课上给的标准归约。考试里 IS 的 NP-hardness 直接引用即可。','Pick a same-domain source when you can. 3SAT → IS is the lecture reduction; on an exam you may cite IS as known NP-C.'),it:'info',S:sc({cl:0}),P:PN()});
  Rc.add({t:tr('每个子句一组顶点 + clause edges','One vertex per literal + clause edges'),d:tr('每个 literal 出现一次就建一个顶点；同一子句内两两连边（三角形 / 一条边 / 单点）。\n→ 一个 IS 在每个子句里最多选 1 个。','Create one vertex per literal occurrence and connect every pair within a clause (triangle / edge / single vertex).\n→ An independent set takes at most one vertex per clause.'),
    ins:'',it:'hide',S:sc({cl:3}),P:PN()});
  Rc.add({t:tr('Variable edges：x 连 ¬x','Variable edges: connect x to ¬x'),d:tr('所有互补的 literal 之间连边：x1–¬x1、x2–¬x2（两处）、¬x3–x3。\n→ IS 不会同时选 x 和 ¬x，赋值不会自相矛盾。','Join every complementary pair of occurrences: x1–¬x1, x2–¬x2 (twice), ¬x3–x3.\n→ The independent set never picks both x and ¬x, so the assignment is consistent.'),
    ins:tr('input transformation：顶点 O(m)，variable edges 最坏 O(m²)，g = m。','Input transformation: O(m) vertices, at worst O(m²) variable edges, and g = m.'),it:'info',S:sc({cl:3,ve:true}),P:PN()});
  const pick=['b','e','g'];
  Rc.add({t:tr('⇒ 有满足赋值 ⇒ 有大小 m 的 IS','⇒ satisfiable ⇒ an IS of size m'),d:tr('取 x2 = T、x3 = T（x1 任意）。每个子句挑一个为真的 literal：c1 选 x2、c2 选 x2、c3 选 x3。\n每组只选 1 个 → 没有 clause edge；没有同时选 x 和 ¬x → 没有 variable edge。大小 = 3 = g。','Take x2 = T, x3 = T (x1 either). Pick one true literal per clause: x2 in c1, x2 in c2, x3 in c3.\nOne per group → no clause edge; never x with ¬x → no variable edge. Size 3 = g.'),
    ins:tr('两个 x2 顶点之间没有边：只有互补的 literal 才连 variable edge。','The two x2 vertices are not adjacent: variable edges join only complementary literals.'),it:'ok',
    S:sc({cl:3,ve:true,ns:k=>pick.includes(k)?'ok':'n',foot:'S = {x2(c1), x2(c2), x3(c3)}  ·  |S| = 3 = g'}),P:PN([tbl(tr('赋值','Assignment'),['var','value'],[['x1',tr('任意','either')],['x2','T'],['x3','T']])])});
  Rc.add({t:tr('⇐ 有大小 ≥ m 的 IS ⇒ 可满足','⇐ an IS of size ≥ m ⇒ satisfiable'),d:tr('clause edges 让每个子句最多选 1 个，而 |S| ≥ m → 每个子句恰好 1 个。\n把选中的 literal 设为 T。variable edges 保证不会把 x 和 ¬x 同时设 T。\n没被选到的变量（这里 x1）随便赋值。每个子句都有一个真 literal。','Clause edges allow at most one vertex per clause, and |S| ≥ m → exactly one per clause.\nSet each chosen literal to T. Variable edges guarantee x and ¬x are never both T.\nVariables never chosen (here x1) get any value. Every clause has a true literal.'),
    ins:tr('"at most g" 和 "exactly g" 要分清：这里由 ≥ m 推出 exactly 1 per clause，是 clause edges 给的。','Keep "at least" and "exactly" straight: ≥ m gives exactly one per clause because of the clause edges.'),it:'warn',
    S:sc({cl:3,ve:true,veSt:'dim',ns:k=>pick.includes(k)?'ok':'dim',foot:tr('x2 = T, x3 = T, x1 = 任意','x2 = T, x3 = T, x1 = either')}),P:PN()});
  Rc.add({t:tr('Output transformation + NO','Output transformation + NO'),d:tr('IS 返回 S → 每个顶点对应的 literal 设 T，未出现的变量设任意值，返回赋值。\nIS 返回 NO → 3SAT 返回 NO。O(n + m)。','IS returns S → set each chosen vertex\'s literal to T, give unmentioned variables any value, return the assignment.\nIS returns NO → 3SAT returns NO. O(n + m).'),
    ins:tr('IS ∈ NP：检查 |S| ≥ g，再检查 S 中任两点之间没边 → O(n²)（或扫边 O(n+m)）。','IS ∈ NP: check |S| ≥ g and that no edge joins two vertices of S → O(n²) (or O(n+m) by scanning edges).'),it:'done',
    S:sc({cl:3,ve:true,ns:k=>pick.includes(k)?'ok':'n'}),P:[tbl('Runtime',[tr('部分','part'),'Big-O'],[['IS ∈ NP','O(n²)'],['Input transform','O(m²)'],['Output transform','O(n+m)']])]});
  return Rc.L;
}

/* ============================== IS ↔ VC / Clique ============================== */
function simVC(){
  const Rc=rec();
  const P={A:[110,90],B:[250,70],C:[400,90],D:[460,240],E:[290,300],F:[110,270]};
  const E=[['A','B'],['B','C'],['C','D'],['D','E'],['E','F'],['B','E']];
  const ids=Object.keys(P), has=(u,v)=>E.some(([a,b])=>(a===u&&b===v)||(a===v&&b===u));
  const NE=[]; for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++) if(!has(ids[i],ids[j])) NE.push([ids[i],ids[j]]);
  const S=['A','C','F'], VC=['B','D','E'];
  const sc=o=>{ const out=[];
    if(o.comp) NE.forEach(([u,v])=>out.push(D.line(P[u][0],P[u][1],P[v][0],P[v][1],{...ES[(S.includes(u)&&S.includes(v))?'ok':'p']})));
    E.forEach(([u,v])=>out.push(D.line(P[u][0],P[u][1],P[v][0],P[v][1],{...ES[o.comp?'dim':(o.es?o.es(u,v):'n')]})));
    ids.forEach(k=>out.push(D.node(P[k][0],P[k][1],k,o.ns?o.ns(k):'n')));
    out.push(D.txt(280,22,o.cap||'',{c:'text',fs:12.5,w:600}));
    if(o.foot) out.push(D.txt(280,362,o.foot,{c:'amber',fs:12.5}));
    return out; };
  Rc.add({t:tr('输入：(G, g)，求 IS','Input: (G, g) for IS'),d:tr('n = 6、m = 6，g = 3。\nIS：|S| ≥ g，S 内任两点不相邻。','n = 6, m = 6, g = 3.\nIS: |S| ≥ g with no edge inside S.'),ins:'',it:'hide',S:sc({cap:'G · g = 3'}),P:[chips(tr('三个问题','Three problems'),[{x:'IS: |S| ≥ g',c:'ok'},{x:'VC: |S| ≤ b',c:'b'},{x:'Clique: |S| ≥ g',c:'p'}])]});
  Rc.add({t:'S = {A, C, F}',d:tr('黑盒返回 S = {A, C, F}。三点之间没有边，|S| = 3 = g。','The black box returns S = {A, C, F}. No edges among them, |S| = 3 = g.'),
    ins:tr('IS ∈ NP：O(n²) 查所有点对 + 数 |S|。runtime 不能依赖 g 的数值。','IS ∈ NP: O(n²) over pairs + count |S|. The runtime must not depend on the value of g.'),it:'info',S:sc({cap:'G · g = 3',ns:k=>S.includes(k)?'ok':'n'}),P:[chips('S',S.map(x=>({x,c:'ok'})))]});
  Rc.add({t:tr('IS → VC：同一张图，b = n − g','IS → VC: same graph, b = n − g'),d:tr('V∖S = {B, D, E}，大小 3 = n − g。\n每条边至少有一个端点在 V∖S：如果某条边两端都不在 V∖S，它就在 S 里面，与 S 是 IS 矛盾。','V∖S = {B, D, E}, size 3 = n − g.\nEvery edge has an endpoint in V∖S: an edge with neither endpoint there would lie inside S, contradicting independence.'),
    ins:tr('S 是 IS ⟺ V∖S 是 VC。input transform：(G, g) → (G, n − g)，O(1)。output：S = V ∖ VC，O(n)。','S is an IS ⟺ V∖S is a VC. Input: (G, g) → (G, n − g), O(1). Output: S = V ∖ VC, O(n).'),it:'ok',
    S:sc({cap:'G · b = n − g = 3',ns:k=>VC.includes(k)?'b':'ok',es:()=> 'cl',foot:tr('蓝 = VC，每条边至少碰到一个蓝点','blue = VC; every edge touches a blue vertex')}),P:[chips('V ∖ S = VC',VC.map(x=>({x,c:'b'}))),tbl(tr('逐边检查','Edge check'),['edge',tr('VC 端点','VC endpoint')],E.map(([u,v])=>[u+'–'+v,[u,v].filter(x=>VC.includes(x)).join(', ')]))]});
  Rc.add({t:tr('IS → Clique：补图 Ḡ，同一个 g','IS → Clique: complement Ḡ, same g'),d:tr(`Ḡ 有 ${NE.length} 条边：G 里没有的点对都连上。\nS = {A, C, F} 在 G 里两两不相邻 → 在 Ḡ 里两两相邻 → 是 Ḡ 的 clique。`,`Ḡ has ${NE.length} edges: every pair missing from G.\nS = {A, C, F} is pairwise non-adjacent in G → pairwise adjacent in Ḡ → a clique in Ḡ.`),
    ins:tr('input transform 要建补图：O(n²)。output transform：clique 原样返回，但也要写出来，并写 NO → NO。','The input transformation builds the complement: O(n²). The output returns the clique unchanged, but still write it out, plus NO → NO.'),it:'info',
    S:sc({cap:'Ḡ · g = 3',comp:true,ns:k=>S.includes(k)?'ok':'p',foot:tr('紫 = Ḡ 的边 · 绿 = S 内部的边','purple = edges of Ḡ · green = edges inside S')}),P:[chips(tr('Ḡ 的边','Edges of Ḡ'),NE.map(([u,v])=>({x:u+v,c:S.includes(u)&&S.includes(v)?'ok':'p'})))]});
  Rc.add({t:tr('方向和 NO','Direction and NO'),d:tr('证 VC 是 NP-hard：IS → VC（已知 → 新）。证 Clique：IS → Clique。\n黑盒返回 NO → 原问题返回 NO。','To show VC is NP-hard: IS → VC (known → new). For Clique: IS → Clique.\nIf the black box returns NO → return NO for the original problem.'),
    ins:tr('VC 是 "at most b"，IS/Clique 是 "at least g"。写 b = n − g 时不等号方向要对上。','VC is "at most b"; IS/Clique are "at least g". With b = n − g, make sure the inequalities line up.'),it:'done',
    S:sc({cap:'G',ns:k=>S.includes(k)?'ok':'b'}),P:[tbl(tr('三个归约','Three reductions'),['',tr('输入','input'),tr('输出','output')],[['IS → VC','(G, n−g)','V ∖ S'],['IS → Clique','(Ḡ, g)','S'],['Clique → IS','(Ḡ, g)','S']])]});
  return Rc.L;
}

    ins:tr('用 lecture 的标准形式，不是课本的。转换之前就取对偶是常见失分点。','Use the lecture\'s standard form, not the textbook\'s. Taking the dual before converting is a common point loss.'),it:'warn',S:mat({}),P:[code('Primal',PR)]});
  Rc.add({t:tr('每个约束一个乘子 y_i ≥ 0','One multiplier y_i ≥ 0 per constraint'),d:tr('3 个约束 → 3 个对偶变量。y_i ≥ 0 才能保持 ≤ 的方向。','3 constraints → 3 dual variables. y_i ≥ 0 keeps each ≤ pointing the same way.'),ins:'',it:'hide',
    S:mat({y:['y1','y2','y3'],rowHi:[1,1,1]}),P:[code('Primal',PR)]});

    ins:tr('对偶约束 = A 的列。第 j 个对偶约束对应 primal 变量 x_j。','Dual constraints are the columns of A. The j-th dual constraint belongs to primal variable x_j.'),it:'info',

    ins:tr('primal feasible & bounded ⟺ dual feasible & bounded，且最优值相等。Max-flow = min-cut 就是它的特例。','Primal feasible & bounded ⟺ dual feasible & bounded, with equal optima. Max-flow = min-cut is a special case.'),it:'done',

const NPC=(hard,extra=[])=>chips(tr('复杂度类','Complexity class'),[{x:'∈ NP',c:'ok'},{x:'NP-hard',c:'ok'},{x:'NP-complete',c:'hot'},...extra],tr('NP-hard 来源：','NP-hard via: ')+hard);

/* clause rows: cls = [[lit,...],...], asg = {x1:1,...} or null */
function clauseScene(cls,asg,o={}){
  const out=[], y0=o.y0||70, rh=o.rh||52;
  if(o.cap) out.push(D.txt(280,24,o.cap,{c:'text',fs:12.5,w:600}));
  cls.forEach((c,i)=>{ const y=y0+i*rh; out.push(D.txt(40,y+15,'c'+(i+1),{c:'faint',fs:11}));
    let sat=false;
    c.forEach((l,k)=>{ const neg=l.startsWith('¬'), v=asg?asg[neg?l.slice(1):l]:null, tv=v==null?null:(neg?1-v:v); if(tv) sat=true;
      const x=70+k*76; out.push(lit(l,{x,y,w:52,st:tv==null?'n':(tv?'ok':'r')}));
      if(k<c.length-1) out.push(D.txt(x+64,y+15,'∨',{c:'muted',fs:13})); });
    if(asg) out.push(D.txt(70+c.length*76+10,y+15,sat?'✓':'✗',{c:sat?'green':'red',fs:16,w:600,a:'start'}));
  });
  if(o.foot) out.push(D.txt(280,o.fy||(y0+cls.length*rh+18),o.foot,{c:'amber',fs:12.5}));
  return out;
}

function simZOEp(){

  const sc=(M,x,o={})=>{ const R=M.length; return [...gridScene(R+1,6,{lw:50,cs:40,cw:52,y0:70,cl:[...Array.from({length:5},(_,j)=>['col',`x${j+1}`]),['','Ax']],rl:[...M.map((_,i)=>'row '+(i+1)),'x'],sep:5,
    cap:o.cap,val:(i,j)=>{ if(i===R) return j<5?(x?x[j]:'?'):''; if(j===5) return x?M[i].reduce((s,v,k)=>s+v*x[k],0):''; return M[i][j]; },
    st:(i,j)=>{ if(i===R) return j<5?(x&&x[j]?'hot':'n'):'none'; if(j===5){ if(!x) return 'ghost'; const s=M[i].reduce((a,v,k)=>a+v*x[k],0); return s===1?'ok':'r'; } return M[i][j]?(x&&x[j]?'ok':'b'):'n'; },foot:o.foot})]; };
  Rc.add({t:tr('实例：0/1 矩阵 A','Instance: a 0/1 matrix A'),d:tr('找 0/1 向量 x 使 Ax = 1：每一行恰好选中一个 1。\n等价于「选一些列，让每行被恰好覆盖一次」。','Find a 0/1 vector x with Ax = 1: every row has exactly one chosen 1.\nEquivalently, choose columns so each row is covered exactly once.'),ins:'',it:'hide',S:sc(A,null,{cap:'A (4 × 5)'}),P:P([V])});
  const xb=[1,0,1,1,0];
  Rc.add({t:tr('候选 x = (1,0,1,1,0)：被拒','Candidate x = (1,0,1,1,0): rejected'),d:tr('第 1 行 = 1 + 1 = 2 ≠ 1；第 2 行 = 0 ≠ 1。','Row 1 = 1 + 1 = 2 ≠ 1; row 2 = 0 ≠ 1.'),ins:tr('是「恰好 1」：多了少了都不行。','It must be exactly 1: more or fewer both fail.'),it:'warn',S:sc(A,xb,{cap:'x = (1, 0, 1, 1, 0)'}),P:P([V])});
  const xg=[0,0,1,1,1];
  Rc.add({t:tr('一个解：x = (0,0,1,1,1)','A solution: x = (0,0,1,1,1)'),d:tr('每行恰好一个绿色 1 → Ax = (1,1,1,1)。','Each row has exactly one green 1 → Ax = (1,1,1,1).'),ins:'',it:'hide',S:sc(A,xg,{cap:'x = (0, 0, 1, 1, 1)'}),P:P([V])});
  const A2=[...A,[0,0,0,0,0]];
  Rc.add({t:tr('NO 实例：多一行全 0','A NO instance: add an all-zero row'),d:tr('第 5 行全是 0，不论 x 怎么取和都是 0 ≠ 1 → 返回 NO。','Row 5 is all zeros, so its sum is 0 ≠ 1 for every x → return NO.'),
    ins:tr('ZOE 是 ILP 的特例（Ax ≤ 1 且 −Ax ≤ −1，0 ≤ x ≤ 1，x 整数），所以 ZOE → ILP 几乎不用改。','ZOE is a special case of ILP (Ax ≤ 1, −Ax ≤ −1, 0 ≤ x ≤ 1, x integer), so ZOE → ILP needs almost no work.'),it:'done',S:sc(A2,xg,{cap:tr('加一行全 0 → NO','an all-zero row → NO')}),P:P([V])});
  return Rc.L;
}

    out.push(D.txt(120,62,'B',{c:'soft',fs:12,w:600}),D.txt(280,62,'G',{c:'soft',fs:12,w:600}),D.txt(440,62,'P',{c:'soft',fs:12,w:600}));
    if(o.foot) out.push(D.txt(280,360,o.foot,{c:'amber',fs:12.5})); return out; };

  Rc.add({t:tr('候选 {t1, t3, t5}：被拒','Candidate {t1, t3, t5}: rejected'),d:tr('g1 被 t1、t3 用了两次；p1 被 t3、t5 用了两次 → 不是匹配。','g1 is used by both t1 and t3; p1 by both t3 and t5 → not a matching.'),ins:'',it:'hide',S:sc(['t1','t3','t5'],{foot:tr('红 = 被用了两次','red = used twice')}),P:P([V,TT()])});
  Rc.add({t:tr('一个解：{t1, t4, t5}','A solution: {t1, t4, t5}'),d:'(b1, g1, p2) · (b2, g3, p3) · (b3, g2, p1)',ins:tr('9 个元素每个恰好被用一次。','Each of the 9 elements is used exactly once.'),it:'ok',S:sc(['t1','t4','t5']),P:P([V,TT()])});
  Rc.add({t:tr('NO 实例：去掉 t4','A NO instance: remove t4'),d:tr('b2 只剩 t3 = (b2, g1, p1)，选了它 g1、p1 就被占；b1 的 t1 要 g1、t2 要 p1，都冲突 → 返回 NO。','b2 is left with only t3 = (b2, g1, p1), which takes g1 and p1; b1\'s options t1 (needs g1) and t2 (needs p1) both clash → return NO.'),
    ins:tr('形状：「分成互不相交的三人组」。DPV 用 3DM → ZOE：每个元素一行、每个三元组一列。','Shape: "split into disjoint groups of three". DPV reduces 3DM → ZOE: one row per element, one column per triple.'),it:'done',S:sc(['t3'],{drop:['t4'],foot:tr('t3 一旦被选，b1 无处可去','once t3 is chosen, b1 has nowhere to go')}),P:P([V])});
  return Rc.L;
}

    if(p.v!==''){ const t=mk('text',{x:p.x+p.w/2,y:p.y+p.h/2+1,'text-anchor':'middle','dominant-baseline':'middle','font-size':p.fs||13,'font-weight':600,fill:c[2]},svg); t.textContent=p.v; } }
  else if(p.k==='txt'){ if(p.s==='') return; const t=mk('text',{x:p.x,y:p.y,'text-anchor':p.a||'middle','dominant-baseline':'middle','font-size':p.fs||12,'font-weight':p.w||400,fill:COL[p.c]||p.c||COL.muted,class:'el'},svg); t.textContent=p.s; }
  else if(p.k==='rect'){ mk('rect',{x:p.x,y:p.y,width:p.w,height:p.h,rx:p.r??6,fill:p.f||'none',stroke:COL[p.s]||p.s||COL.line,'stroke-width':p.sw||1.5,'stroke-dasharray':p.d||'none'},svg); }
  else if(p.k==='line'){ mk('line',{x1:p.x1,y1:p.y1,x2:p.x2,y2:p.y2,stroke:COL[p.s]||p.s||COL.line,'stroke-width':p.w||1.4,'stroke-dasharray':p.d||'none','stroke-linecap':'round'},svg); }
  else if(p.k==='poly'){ mk('polygon',{points:p.pts.map(q=>q.map(v=>v.toFixed(1)).join(',')).join(' '),fill:p.f||'none',stroke:p.s||'none','stroke-width':p.sw||1.5},svg); }
  else if(p.k==='node'){ const c=CS[p.st]||CS.n, r=p.r||22; mk('circle',{cx:p.x,cy:p.y,r,fill:c[0],stroke:c[1],'stroke-width':2.2},svg);
    if(p.lab){ const t=mk('text',{x:p.x,y:p.y+1,'text-anchor':'middle','dominant-baseline':'middle','font-size':p.lab.length>2?12:14,'font-weight':600,fill:c[2]},svg); t.textContent=p.lab; } }
}
function render(){
  const s=STEPS[cur], svg=$('g'); svg.innerHTML='';
  (s.S||[]).forEach(p=>draw(svg,p));
  $('g-badge').textContent=`step ${cur}`;
  $('s-lbl').textContent=`STEP ${cur} / ${STEPS.length-1}`; $('s-title').textContent=s.t; $('s-desc').textContent=s.d;
  const ins=$('s-ins'); ins.hidden=!s.ins||s.it==='hide'; ins.className='ins '+(s.it||'info'); ins.textContent=s.ins||'';
  $('panels').innerHTML=(s.P||[]).map(panel).join('');
  $('b-prev').disabled=cur===0; $('b-next').disabled=cur===STEPS.length-1;
  $('prog').style.width=(STEPS.length>1?cur/(STEPS.length-1)*100:0)+'%'; $('ctr').textContent=`${cur} / ${STEPS.length-1}`;
}
function panel(p){
  const head=`<h3>${esc(p.title)}${p.sub?` <small>${esc(p.sub)}</small>`:''}</h3>`;
  if(p.k==='chips') return `<div class="card pnl">${head}<div class="chips">${p.items.map(i=>`<span class="chip ${i.c||''}">${esc(i.x)}</span>`).join('')}</div></div>`;
  if(p.k==='note') return `<div class="card pnl">${head}<div style="font-family:var(--f-mono);font-size:17px;color:var(--ac)">${esc(p.text)}</div></div>`;
  if(p.k==='code') return `<div class="card pnl">${head}<pre class="rec">${esc(p.text)}</pre></div>`;
  const hi=new Set(p.hi||[]), rh=new Set(p.rowhi||[]);
  return `<div class="card pnl">${head}<div class="tw"><table class="dt"><thead><tr>${p.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>`+
    p.rows.map((r,i)=>`<tr class="${rh.has(i)?'rh':''}">${r.map((c,j)=>`<td class="${hi.has(i+','+j)?'hi':''}">${esc(c)}</td>`).join('')}</tr>`).join('')+`</tbody></table></div></div>`;
}
function stop(){ if(timer){clearInterval(timer);timer=null;} $('b-play').textContent='▶ Play'; }
function go(d){ if(!A) return; const n=cur+d; if(n<0||n>STEPS.length-1) return; cur=n; render(); }
function setLang(l){
  LANG=l; try{ localStorage.setItem('np-lang',l); }catch(e){}
  ALGOS.forEach(a=>a.steps=null);
  applyStatic(); buildNav(); buildOverview(); buildOps(); buildPre(); select(VIEW,true);
}
$('lang').onclick=()=>setLang(LANG==='en'?'zh':'en');
$('b-prev').onclick=()=>{stop();go(-1);}; $('b-next').onclick=()=>{stop();go(1);};
$('b-play').onclick=()=>{ if(timer){stop();return;} if(cur===STEPS.length-1){cur=0;render();}
  $('b-play').textContent='⏸ Pause'; timer=setInterval(()=>{ if(cur<STEPS.length-1){cur++;render();} else stop(); },2400); };
document.addEventListener('keydown',e=>{ if(e.target.closest&&e.target.closest('input,textarea,button')&&e.key===' ') return;
  if(e.key==='ArrowRight'){stop();go(1);} else if(e.key==='ArrowLeft'){stop();go(-1);}
  else if(e.key===' '&&A){e.preventDefault();$('b-play').click();}
  else if(e.key===']'||e.key==='['){ const ids=[...STATIC,...ALGOS.map(a=>a.id)]; const i=ids.indexOf(VIEW); const j=(i+(e.key===']'?1:-1)+ids.length)%ids.length; select(ids[j]); } });

applyStatic(); buildNav(); buildOverview(); buildOps(); buildPre();
const h0=(location.hash||'').slice(1);
select([...STATIC,...ALGOS.map(a=>a.id)].includes(h0)?h0:'sat3');
</script>
